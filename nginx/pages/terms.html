<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Terms of Service</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            padding: 24px;
            display: grid;
            place-items: center;
            background: linear-gradient(
                180deg,
                #10212a 0%,
                #081016 100%
            );
            color: #f4f7fb;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        main {
            width: 100%;
            max-width: 700px;
            padding: 32px;
            border-radius: 24px;
            background: rgba(8, 16, 22, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(14px);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 28px;
        }

        p {
            margin: 0;
            color: rgba(244, 247, 251, 0.7);
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 24px;
            color: #ffcf5c;
            font-weight: 600;
            text-decoration: underline;
        }

        a:hover {
            color: #ff9f43;
        }
    </style>
</head>

<body>
    <main>
        <h1>Terms of Service</h1>

        <p>
            This is a demo application and is provided as-is
            without any warranties.
        </p>

        <a href="/">
            Back to application
        </a>
    </main>
</body>
</html>

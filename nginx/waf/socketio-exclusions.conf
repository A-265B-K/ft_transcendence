# Socket.IO / Engine.IO uses text/plain for HTTP long-polling.
# OWASP CRS rule 920420 rejects this content type by default.
#
# Exclude only rule 920420 for POST requests to /socket.io/.
# All other CRS rules remain active.

SecRule REQUEST_URI "@beginsWith /socket.io/" \
    "id:100100,phase:1,pass,nolog,chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,ctl:ruleRemoveById=920420"
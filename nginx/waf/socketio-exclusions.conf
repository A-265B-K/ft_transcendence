# Exclusion in order to be able to create rooms
# Exclude CRS 920420 only for matching polling POST requests.
# All other CRS rules remain active.

SecRule REQUEST_URI "@beginsWith /socket.io/" \
    "id:100100,phase:1,pass,nolog,chain"
    SecRule REQUEST_METHOD "@streq POST" "t:none,chain"
    SecRule REQUEST_HEADERS:Content-Type "@rx ^text/plain(?:[[:space:]]*;|$)" \
        "t:none,t:lowercase,ctl:ruleRemoveById=920420"
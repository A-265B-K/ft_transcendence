services:
    frontend:
      build:
        context: ./frontend
        dockerfile: ../docker/frontend/Dockerfile
      working_dir: /app
      volumes:
        - ./frontend:/app
        - frontend_node_modules:/app/node_modules

    backend:
      image: node:latest
      working_dir: /app
      volumes:
        - ./backend:/app
        - backend_node_modules:/app/node_modules
      environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_HOST: postgres
        POSTGRES_PORT: 5432
        POSTGRES_DB: ${POSTGRES_DB}
      command: sh -c "npm install && node backend/srcs/server.js"

    nginx:
      image: nginx
      entrypoint: ["nginx", "-g", "daemon off;"]
      depends_on:
        nginx-certgen:
          condition: service_completed_successfully
        frontend:
          condition: service_started
        prometheus:
          condition: service_started
        grafana:
          condition: service_started
      ports:
        - "8443:443"
      volumes:
        - ./docker/nginx/config.conf:/etc/nginx/conf.d/default.conf:ro
        - ./docker/nginx/privacy.html:/var/www/html/privacy.html:ro
        - ./docker/nginx/terms.html:/var/www/html/terms.html:ro
        - nginx_certs:/etc/nginx/ssl:ro
    nginx-certgen:
      image: alpine/openssl
      entrypoint: ["/bin/sh", "-c"]
      command:
        - |
          if [ ! -f /etc/nginx/ssl/nginx.crt ] || [ ! -f /etc/nginx/ssl/nginx.key ]; then
            openssl req -x509 -nodes -days 365 \
              -newkey rsa:2048 \
              -subj "/CN=localhost" \
              -addext "subjectAltName=DNS:localhost,DNS:*.localhost" \
              -keyout /etc/nginx/ssl/nginx.key \
              -out /etc/nginx/ssl/nginx.crt
          fi
      volumes:
        - nginx_certs:/etc/nginx/ssl
    postgres:
      image: postgres
      volumes:
        - postgres_data:/var/lib/postgresql
        - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      environment:
        POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
        POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set}
    postgresexporter:
      build: ./docker/postgresexporter
      environment:
        POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
        POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set}
       

    nginx_exporter:
      image: nginx/nginx-prometheus-exporter
      command: -nginx.scrape-uri http://nginx:3001/stub_status
 
    prometheus:
      image: prom/prometheus
      volumes:
        - ./devops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        - prometheus:/prometheus

    grafana:
      image: grafana/grafana
      environment:
        GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is not set}
        GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is not set}
        GF_LOG_LEVEL: warn
        GF_SERVER_ROOT_URL: "https://monitoring.localhost:8443/"
        GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      volumes:
        - ./devops/grafana/provisioning:/etc/grafana/provisioning:ro
        - ./devops/grafana/dashboards:/var/lib/grafana/dashboards
        - grafana:/var/lib/grafana

volumes:
  prometheus:
  grafana:
  postgres_data:
  nginx_certs:
  frontend_node_modules:
  backend_node_modules:

services:
    frontend:
      build:
        context: ./frontend
        dockerfile: ../frontend/Dockerfile
      volumes:
        - ./frontend:/workspace/app
      healthcheck:
        test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/"]
        interval: 1s
        timeout: 3s
        retries: 10
        start_period: 10s
    backend:
      build:
        context: ./backend
        dockerfile: ../backend/Dockerfile
      volumes:
        - ./backend:/workspace/app
      environment:
        POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
        POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set}
        EMAIL_USER: ${EMAIL_USER:?EMAIL_USER is not set}
        EMAIL_PASSWORD: ${EMAIL_PASSWORD:?EMAIL_PASSWORD is not set}
        HOSTNAME: ${HOSTNAME:?HOSTNAME is not set}
      healthcheck:
        test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/ping"]
        interval: 1s
        timeout: 3s
        retries: 10
        start_period: 10s

    nginx:
      build: ./nginx
      depends_on:
        frontend:
          condition: service_healthy
        backend:
          condition: service_healthy
        grafana:
          condition: service_healthy
      ports:
        - "8443:443"
      volumes:
        - ./nginx/pages:/var/www/html/
    postgres:
      image: postgres:18.4
      volumes:
        - postgres_data:/var/lib/postgresql
        - ./postgres/init:/docker-entrypoint-initdb.d:ro
      environment:
        POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
        POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set}
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
        interval: 5s
        timeout: 3s
        retries: 10

    postgresexporter:
      build: ./postgres/exporter
      environment:
        POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
        POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set}

    nginx_exporter:
      image: nginx/nginx-prometheus-exporter:1.5.1
      command: ["--nginx.scrape-uri", "http://nginx:3001/stub_status"]
 
    prometheus:
      image: prom/prometheus:v3.13.1
      volumes:
        - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        - prometheus:/prometheus
      healthcheck:
        test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
        interval: 5s
        timeout: 3s
        retries: 10
      command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-admin-api


    grafana:
      image: grafana/grafana:13.0-slim
      environment:
        GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is not set}
        GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is not set}
        GF_LOG_LEVEL: warn
        GF_SERVER_SERVE_FROM_SUB_PATH: "true"
        GF_SERVER_ROOT_URL: "https://monitoring.localhost:8443/"
      volumes:
        - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
        - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
        - grafana:/var/lib/grafana
      healthcheck:
        test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health"]
        interval: 1s
        timeout: 3s
        retries: 10
        start_period: 10s

    backups:
      build: ./backups
      volumes:
        - prometheus:/app/prometheus
        - grafana:/app/grafana
        - postgres_data:/app/postgress
        - ./backups/backups:/app/backups
      environment:
        POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set}
        PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
        POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set}
      depends_on:
        prometheus:
          condition: service_healthy
        postgres:
          condition: service_healthy

volumes:
  prometheus:
  grafana:
  postgres_data:

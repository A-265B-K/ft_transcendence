global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: nginx
    static_configs:
      - targets:
          - nginx_exporter:9113

  - job_name: node
    static_configs:
      - targets: ["node_exporter:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["telegraf:9273"]
        labels:
          # Keep the label used by the existing Grafana dashboard queries.
          instance: "monitoringexporter:80"

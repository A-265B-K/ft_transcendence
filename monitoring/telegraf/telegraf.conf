[agent]
  interval = "15s"
  flush_interval = "5s"
  omit_hostname = true

[[secretstores.docker]]
  id = "docker_secrets"

[[inputs.http]]
  urls = ["http://backend:3000/stats"]
  timeout = "3s"
  data_format = "json_v2"
  tagexclude = ["url"]

  [[inputs.http.json_v2]]
    measurement_name = "prometheus"

    [[inputs.http.json_v2.field]]
      path = "activeRooms"
      rename = "activerooms"
      type = "int"

[[inputs.sql]]
  driver = "pgx"
  dsn = "@{docker_secrets:telegraf_postgres_dsn}"
  timeout = "5s"
  disconnected_servers_behavior = "ignore"

  [[inputs.sql.query]]
    measurement = "prometheus"
    query = "SELECT registered_players, gamehistory FROM monitoring.game_counts"

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  expiration_interval = "45s"

  [outputs.prometheus_client.metric_types]
    gauge = ["activerooms", "registered_players", "gamehistory"]

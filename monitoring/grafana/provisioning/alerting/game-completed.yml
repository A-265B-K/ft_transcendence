apiVersion: 1

groups:
  - orgId: 1
    name: Game completed
    folder: Monitoring
    interval: 30s
    rules:
      - uid: game-completed
        title: Game completed
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: A game was completed.
        notification_settings:
          receiver: Alert email
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: PBFA97CFB590B2093
              editorMode: code
              expr: gamehistory{job="postgres"} - gamehistory{job="postgres"} offset 2m
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold

apiVersion: 1

groups:
  - orgId: 1
    name: Game health
    folder: Monitoring
    interval: 30s
    rules:
      - uid: game-api-unreachable
        title: Game API unreachable
        condition: B
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: The game health endpoint is unreachable or returned an unhealthy response.
        data:
          - refId: A
            datasourceUid: dg5a5c5wm524ge
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              datasource:
                type: yesoreyeram-infinity-datasource
                uid: dg5a5c5wm524ge
              type: json
              source: url
              url: https://host.docker.internal:8443/api/ping
              url_options:
                data: ''
                method: GET
              parser: jq-backend
              format: table
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              root_selector: '[{"up": (if .ok == true then 1 else 0 end)}]'
              columns:
                - selector: up
                  text: up
                  type: number
              filters: []
              global_query_id: ''
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: math
              expression: '$A < 1'

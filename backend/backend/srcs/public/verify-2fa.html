<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Verify 2FA</title>
</head>

<body>

<h1>Two-Factor Authentication</h1>

<label>
    Email:
    <input id="email" type="email">
</label>

<br><br>

<label>
    Authentication code:
    <input id="token" type="text" maxlength="6">
</label>

<br><br>

<button onclick="verify2FA()">
    Verify
</button>

<p id="message"></p>

<script>

async function verify2FA() {

    const email =
        document.getElementById("email").value;

    const token =
        document.getElementById("token").value;

    if (!email || !token) {
        document.getElementById("message").innerText =
            "Email and authentication code are required";

        return;
    }

    const response = await fetch(
        "/api/2fa/login",
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                email,
                token
            })
        }
    );

    const data = await response.json();

    console.log("2FA login response:", data);

    if (data.ok) {

        document.getElementById("message").innerText =
            "2FA verified successfully. Redirecting...";

        setTimeout(() => {
            window.location.href = "/";
        }, 1000);

    }
    else {

        document.getElementById("message").innerText =
            data.message ?? "2FA verification failed";

    }
}

</script>

</body>

</html>

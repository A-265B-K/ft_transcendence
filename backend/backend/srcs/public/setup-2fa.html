<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Setup 2FA</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
        }

        input {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
        }

        button {
            padding: 10px 15px;
            margin: 5px 0;
            cursor: pointer;
        }

        img {
            margin-top: 20px;
            width: 250px;
        }

        #message {
            margin-top: 20px;
        }
    </style>
</head>


<body>

<h1>Enable Two-Factor Authentication</h1>


<label>
    Email:
</label>

<input 
    id="email"
    type="email"
    placeholder="your@email.com"
>


<button onclick="setup2FA()">
    Generate QR Code
</button>


<hr>


<h2>Scan QR Code</h2>

<p>
    Scan this QR code using Google Authenticator.
</p>


<img 
    id="qr"
    alt="QR Code will appear here"
>


<hr>


<h2>Confirm Setup</h2>


<label>
    Enter the 6 digit code from your authenticator app:
</label>


<input
    id="token"
    type="text"
    maxlength="6"
    placeholder="123456"
>


<button onclick="confirm2FA()">
    Confirm 2FA
</button>


<hr>


<h2>Disable 2FA</h2>


<button onclick="disable2FA()">
    Disable 2FA
</button>



<p id="message"></p>



<script>


async function setup2FA() {


    const email =
        document.getElementById("email").value;


    if (!email) {

        showMessage("Enter an email first");
        return;

    }


    const response = await fetch(
        "/api/2fa/setup",
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                email
            })
        }
    );


    const data = await response.json();


    if (!data.ok) {

        showMessage(
            data.message ?? "Setup failed"
        );

        return;

    }


    document.getElementById("qr").src =
        data.qrCode;


    showMessage(
        "QR code generated. Scan it with Google Authenticator."
    );

}




async function confirm2FA() {


    const email =
        document.getElementById("email").value;


    const token =
        document.getElementById("token").value;



    if (!email || !token) {

        showMessage(
            "Email and code required"
        );

        return;

    }



    const response = await fetch(
        "/api/2fa/confirm",
        {
            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                email,
                token
            })
        }
    );


    const data = await response.json();



    if(data.ok) {

        showMessage(
            "2FA successfully enabled"
        );

    }
    else {

        showMessage(
            data.message ?? "Invalid code"
        );

    }

}




async function disable2FA() {


    const email =
        document.getElementById("email").value;



    if (!email) {

        showMessage(
            "Enter an email first"
        );

        return;

    }



    const response = await fetch(
        "/api/2fa/disable",
        {
            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                email
            })
        }
    );



    const data = await response.json();



    if(data.ok) {

        showMessage(
            "2FA disabled"
        );

    }
    else {

        showMessage(
            data.message ?? "Failed"
        );

    }

}




function showMessage(text) {

    document.getElementById("message")
        .innerText = text;

}


</script>


</body>

</html>

name: backend

on:
  pull_request:
    branches: [main]

jobs:
  docker:
      runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v5

        - name: Set  up Docker Buildx
          uses: docker/setup-buildx-action@v4
          
        - name: Create .env file
          run: |
            echo DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres > .env
            echo POSTGRES_USER=postgres >> .env
            echo POSTGRES_PASSWORD=postgres >> .env
            echo POSTGRES_DB=postgres >> .env
            echo POSTGRES_PORT=5432 >> .env
            echo GRAFANA_ADMIN_USER=ci-admin >> .env
            echo GRAFANA_ADMIN_PASSWORD=ci-grafana-password >> .env
            echo DATA_SOURCE_USER=postgres >> .env
            echo DATA_SOURCE_PASS=postgres >> .env

        - name: Build, start, and wait for containers
          run: docker compose up --build --detach --wait --wait-timeout 120  
   
        - name: healthcheck_backend
          run: |
            echo "Waiting for backend to be healthy..."
            timeout 120 bash -c 'until curl -sf --insecure https://localhost:8443/api/ping; do sleep 2; done'
            echo "Backend is healthy"

        - name: Show logs on failure
          if: failure()
          run: docker compose logs
name: CI

on:
  pull_request:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create .env file
        run: mv .env.example env
      - name: Build, start, and wait for containers
        run: docker compose up --build --detach --wait --wait-timeout 120

      - name: Check frontend
        run: curl --head --fail --insecure https://localhost:8443

      - name: Check backend
        run: curl --fail --insecure https://localhost:8443/api/ping

      - name: Check database exporter
        run: docker compose exec -T prometheus wget -qO- http://postgresexporter:80
      
    
      - name: Show logs on failure
        if: failure()
        run: docker compose logs

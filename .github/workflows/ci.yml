name: CI

on:
  push:
    branches: ["**"]

jobs:
  App:
    runs-on: ubuntu-latest
    needs: [Codequality]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create .secret file
        run: |
          cp .secret.example .secret
          chmod 600 .secret

      - name: Create .env file
        run: cp .env.example .env

      - name: Bootstrap
        run: ./scripts/bootstrap.sh

      - name: Build, start, and wait for containers
        run: ./scripts/makefile/start.sh

      - name: Wait for HTTPS entrypoint
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --show-error --insecure \
              https://localhost:8443/api/ping \
              -o /dev/null
            then
              exit 0
            fi
            sleep 2
          done

          echo "HTTPS entrypoint did not become ready." >&2
          exit 1
  
      - uses: actions/setup-python@v6

      - name: Install Browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps --only-shell chromium

      - name: Test App
        run: python .github/scripts/Apptest.py


  Codequality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [frontend, backend]

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

name: CI

on:
  pull_request:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create .env file
        run: mv .env.example .env

      - name: Build, start, and wait for containers
        run: docker compose up --build --detach --wait --wait-timeout 60

      - name: Check all containers are still alive
        run: |
          sleep 60
          if docker compose ps --all | grep -v 'nginx-certgen' | grep -qi 'exited'; then
            echo "Some containers exited unexpectedly"
            exit 1
          fi

      - name: Check frontend
        run: test "$(curl -kso /dev/null -w '%{http_code}' https://localhost:8443/)" = "200"

      - name: Check backend
        run: curl --fail --insecure https://localhost:8443/api/ping

      - name: Check database exporter
        run: docker compose exec -T prometheus wget -qO- http://postgresexporter:80

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Try to compile frontend
        run: npm run build